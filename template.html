<!DOCTYPE html>
<html lang="__HTML_LANG__" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d9bf0'/%3E%3C/svg%3E">
<meta name="x-dashboard-mode" content="__MODE__">
<!--__HEAD_EXTRA__-->
<title>X growth dashboard</title>
<!--__ECHARTS__-->
<style>
/*__INTER__*/
:root{
  --bg:#0b0f14;--card:#121820;--card2:#181f28;--line:#243040;--txt:#e8eef3;--mut:#8b98a5;
  --acc:#3b82f6;--ok:#22c55e;--bad:#f43f5e;--warn:#f59e0b;--vio:#a78bfa;--shadow:0 8px 24px rgba(0,0,0,.28);
  --bar:rgba(11,15,20,.94);
  --tl-green:#22c55e;--tl-yellow:#eab308;--tl-orange:#fb923c;--tl-red:#f43f5e;
  --tl-ink:#111827;
  --cal-empty:#243044;
}
html[data-theme="light"]{
  --bg:#f4f6f8;--card:#ffffff;--card2:#eef2f6;--line:#d5dce4;--txt:#111827;--mut:#5b6773;
  --acc:#2563eb;--ok:#16a34a;--bad:#e11d48;--warn:#d97706;--vio:#7c3aed;--shadow:0 8px 24px rgba(15,23,42,.08);
  --bar:rgba(244,246,248,.94);
  --tl-green:#15803d;--tl-yellow:#a16207;--tl-orange:#c2410c;--tl-red:#b91c1c;
  --tl-ink:#ffffff;
  --cal-empty:#e2e8f0;
  color-scheme:light;
}
*{box-sizing:border-box}
html{max-width:100%;color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:100%;font-feature-settings:"tnum" 1}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:650}
h3{font-size:13px;margin:12px 0 6px;color:var(--txt);text-transform:none;letter-spacing:0;font-weight:650}
.sub{color:var(--mut);font-size:12px}
.bar{position:sticky;top:0;z-index:20;height:64px;max-height:64px;background:var(--bar);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 16px;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;max-width:100%;min-width:0}
.bar-head{display:flex;align-items:center;min-width:0;flex:0 1 auto;gap:8px}
.dash-av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;line-height:1}
.dash-av[hidden]{display:none!important}
.dash-av img,.pcard-av img{width:100%;height:100%;object-fit:cover;display:block}
.brand{min-width:0;max-width:14rem}
.brand-title{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap}
.brand-title h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-badge{flex:0 0 auto;display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.01em;line-height:1.35;background:var(--warn);color:#111}
.demo-badge[hidden]{display:none!important}
.demo-strip{display:none;text-align:center;font-size:11px;font-weight:700;padding:4px 10px;background:var(--warn);color:#111;letter-spacing:.01em}
.demo-strip[hidden]{display:none!important}
.brand #acct{display:block;font-size:12px;line-height:1.2;margin-top:1px}
.brand #genline{display:none}
.bar-tools{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;flex:0 0 auto}
.bar-row{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;min-width:0;flex:1 1 auto}
.bar-presets{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;min-width:0}
.bar-presets button{white-space:nowrap}
.p-short{display:none}.p-full{display:inline}
.bar-custom{background:transparent;border:none;border-radius:0;padding:0;margin:0;display:flex;align-items:center;flex-wrap:nowrap;gap:8px;min-width:0;max-width:none;position:relative}
.bar-custom>summary{display:flex;align-items:center;list-style:none;cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-weight:600}
.bar-custom>summary::-webkit-details-marker{display:none}
.bar-custom[open]>summary,.bar-custom.on>summary{background:var(--acc);border-color:var(--acc);color:#fff}
.bar-custom .custom-range{display:none}
.bar-custom[open] .custom-range{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;position:absolute;top:40px;right:0;z-index:8;padding:10px;background:var(--bar);border:1px solid var(--line);border-radius:10px}
.bar button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit}
.bar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar input[type=date],#roi-q,#top-q{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;color-scheme:dark;min-width:0;max-width:100%}
html[data-theme="light"] .bar input[type=date],html[data-theme="light"] #roi-q,html[data-theme="light"] #top-q{color-scheme:light}
.bar input[type=date]{width:11rem;flex:0 0 11rem}
.custom-range{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;min-width:0;flex:0 1 auto}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap;flex-wrap:wrap}
.tog:has(input:disabled){opacity:.7;cursor:not-allowed}
.tog input:disabled{cursor:not-allowed}
.cmp-hint{display:none;color:var(--mut);font-size:11px;font-weight:500}
.cmp-hint.is-on{display:inline}
#more-btn{display:none}
.bar-tools.more-panel{display:flex}
tr.roi-low{background:rgba(244,63,94,.08)}
tr.roi-top{background:rgba(34,197,94,.08)}
.bar .per{display:inline;margin-left:8px;color:var(--mut);font-size:11px;font-weight:600;white-space:nowrap}
.shown-range{display:none;color:var(--mut);font-size:11px;font-weight:600;white-space:nowrap}
nav{display:none;padding:6px 22px;flex-wrap:wrap;gap:10px;font-size:12px;min-width:0}
main.dash,main{padding:12px 16px 24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;max-width:1440px;min-width:0;width:100%;margin:0 auto;overflow-x:hidden}
section{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;max-width:100%;overflow-x:auto;box-shadow:var(--shadow)}
#s1{padding:10px 12px}
#s7{display:none}
@media (min-width:960px){
  #s2{grid-column:span 7}#s4{grid-column:span 5}#s3,#s5,#sr{grid-column:span 4}#hp,#hr{grid-column:span 6}
}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:0}
.cons-panel{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start;min-width:0}
.cons-panel .kpi{height:auto}
.cons-visual{display:grid;grid-template-columns:max-content minmax(140px,1fr);gap:12px 18px;align-items:start;min-width:0}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;min-width:0;box-shadow:var(--shadow)}
.kpi-tl{border-left-width:4px}
.tl-green,.kpi-tl.tl-green{--tl:var(--tl-green)}
.tl-yellow,.kpi-tl.tl-yellow{--tl:var(--tl-yellow)}
.tl-orange,.kpi-tl.tl-orange{--tl:var(--tl-orange)}
.tl-red,.kpi-tl.tl-red{--tl:var(--tl-red)}
.kpi-tl{border-left-color:var(--tl)}
.delta.tl-green{color:var(--tl-green)}.delta.tl-yellow{color:var(--tl-yellow)}.delta.tl-orange{color:var(--tl-orange)}.delta.tl-red{color:var(--tl-red)}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0 0;font-size:11px;color:var(--mut)}
.tl-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.judge-legend{margin:6px 0 8px}
.judge-legend i{width:10px;height:10px}
.judge-scale{display:inline-flex;align-items:center;gap:0;margin-right:8px}
.judge-scale i{margin-right:2px;border-radius:2px}
.judge-legend i.thin{background:var(--tl-yellow);opacity:.42}
html[data-theme="light"] .judge-legend i.thin{background:var(--tl-yellow);opacity:.38}
.judge-advice{margin:4px 0 0;font-size:12px;color:var(--mut);font-weight:500;line-height:1.35}
.cal-wrap{margin:0;min-width:0;width:max-content;max-width:100%;overflow-x:auto;--cal-n:10;--cal-gap:4px;--cal-wd:36px;--cal-sz:22px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cal-grid-wrap{display:grid;grid-template-columns:var(--cal-wd) max-content;grid-template-rows:auto auto;gap:4px 8px;width:max-content;max-width:100%;min-width:0}
.cal-months{grid-column:2;grid-row:1;display:grid;grid-auto-flow:column;grid-auto-columns:var(--cal-sz);gap:var(--cal-gap);color:var(--mut);font-size:11px;font-weight:600;line-height:1.2}
.cal-mon{display:block;overflow:visible;white-space:nowrap;min-width:0}
.cal-wd{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(7,var(--cal-sz));gap:var(--cal-gap);color:var(--mut);font-size:11px;line-height:var(--cal-sz);width:var(--cal-wd)}
.cal-grid{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(7,var(--cal-sz));grid-auto-flow:column;grid-auto-columns:var(--cal-sz);gap:var(--cal-gap);width:max-content;max-width:100%}
.cal-cell{width:var(--cal-sz);height:var(--cal-sz);min-width:0;border-radius:4px;background:var(--cal-empty);box-sizing:border-box}
.cal-cell.tl-green,.dscore-cell.tl-green{background:var(--tl-green)}.cal-cell.tl-yellow,.dscore-cell.tl-yellow{background:var(--tl-yellow)}.cal-cell.tl-orange,.dscore-cell.tl-orange{background:var(--tl-orange)}.cal-cell.tl-red,.dscore-cell.tl-red{background:var(--tl-red)}
.cal-cell.is-incomplete,.dscore-cell.is-incomplete{background:var(--cal-empty);box-shadow:none}
.cal-cell.is-out{opacity:.34}
.cal-cell.is-in-range{box-shadow:inset 0 0 0 1px rgba(232,238,243,.55);opacity:1}
html[data-theme="light"] .cal-cell.is-in-range{box-shadow:inset 0 0 0 1px rgba(17,24,39,.35)}
.wd-sum{min-width:0}
.wd-sum h3{margin:0 0 8px}
.wd-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 2.1rem;gap:6px;align-items:center;margin:3px 0;font-size:11px;color:var(--mut)}
.wd-bar{height:8px;background:var(--cal-empty);border-radius:4px;overflow:hidden}
.wd-bar i{display:block;height:100%;border-radius:4px;background:var(--tl,var(--line));max-width:100%}
.wd-n{text-align:right;font-variant-numeric:tabular-nums}
.dscore{margin-top:6px;min-width:0}
.dscore-row{display:flex;gap:2px;padding:0 14px 0 36px}
.dscore-cell{flex:1 1 0;height:6px;border-radius:2px;background:var(--cal-empty);min-width:0}
.dscore-leg{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:4px;font-size:11px;color:var(--mut)}
.dscore-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.post-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.post-split{display:grid;grid-template-columns:1fr;gap:16px;min-width:0}
.post-split .post-grid{grid-template-columns:1fr}
.split-h{font-size:13px;margin:0 0 10px;color:var(--txt);font-weight:650}
.ptabs{display:flex;flex-wrap:wrap;gap:6px}
.ptabs button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
.ptabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.post-grid{display:grid;grid-template-columns:1fr;gap:10px;min-width:0}
.pcard{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0;box-shadow:var(--shadow);border-left:4px solid var(--tl,var(--line))}
.pcard-hit{display:block;color:inherit;text-decoration:none;min-width:0}
.pcard-hit:hover{text-decoration:none}
.pcard-hd{display:flex;align-items:flex-start;gap:8px;min-width:0}
.pcard-av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pcard-who{min-width:0;flex:1 1 auto}
.pcard-name{font-weight:700;font-size:13px;line-height:1.2}
.pcard-handle,.pcard .top-meta{color:var(--mut);font-size:12px;white-space:normal;overflow:visible}
.pcard-badge{flex:0 0 auto;min-width:2.1rem;text-align:center;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:700;color:var(--tl-ink);background:var(--tl)}
.pcard-reply{color:var(--mut);font-size:12px;margin:6px 0 0}
.pcard-text{margin:8px 0 0;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.pcard.is-open .pcard-text{-webkit-line-clamp:unset;display:block}
.pcard-metrics{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.pcard-more{margin-top:8px;background:transparent;border:0;color:var(--acc);cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:0}
.card-more{margin-top:10px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.kpi .v{font-size:clamp(18px,2.6vw,26px);font-weight:700;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--mut);font-size:10px;margin-top:4px;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.kpi .delta,.kpi .streak{font-size:11px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.kpi .streak{color:var(--mut);font-weight:500}
.kpi .delta .vs{color:var(--mut);font-weight:500;margin-left:4px}
.kpi .spark{height:28px;margin-top:6px}
.ww{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
.ww>div{min-width:0}
.fold{background:transparent;border:1px dashed var(--line);padding:6px 10px;margin:8px 0;max-width:100%}
.fold>summary{color:var(--mut);font-size:13px;font-weight:550;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:10px;min-width:0}
.card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.card .k{color:var(--mut);font-size:12px}.card .v{font-size:24px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}.card .n{color:var(--mut);font-size:12px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--card)}
th[data-key]{cursor:pointer}th[data-key]:hover{color:var(--txt)}
td.r,th.r{text-align:right}
.tw{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:10px;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}
.tw table{width:max-content;min-width:100%}
.tw table th{background:var(--card2)}
.tw.top-full table{width:100%;min-width:100%}
.mini-top{overflow-x:hidden;max-width:100%}
.mini-top table{width:100%;min-width:0;max-width:100%;table-layout:fixed}
.mini-top col.rank{width:2rem}
.mini-top col.metrics{width:7.5rem}
.mini-top td.num{width:2rem;white-space:nowrap;padding-right:8px}
.mini-top td.met{width:7.5rem;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.mini-top td.txt{max-width:none;overflow:visible;white-space:normal;min-width:0}
.mini-top .txt > a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
.mini-top .txt .note,.mini-top .top-meta{white-space:normal;overflow:visible;text-overflow:unset;max-width:100%;margin-top:4px}
.top-metrics{display:none;white-space:nowrap}
.table-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.table-tools input{min-width:min(100%,16rem)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;color:var(--mut);font-size:12px}
.empty{padding:20px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);text-align:center}
.note{color:var(--mut);font-size:12.5px;margin:6px 0}
.warnbox{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.formula{background:var(--card2);border-left:3px solid var(--acc);padding:10px 12px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;margin:6px 0 12px;overflow-x:auto;max-width:100%}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;border:1px solid var(--line);white-space:nowrap}
.p-ok{color:var(--ok);border-color:rgba(34,197,94,.4)}.p-bad{color:var(--bad);border-color:rgba(244,63,94,.4)}
.p-warn{color:var(--warn);border-color:rgba(245,158,11,.4)}.p-mut{color:var(--mut)}.p-vio{color:var(--vio);border-color:rgba(167,139,250,.4)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:12px;min-width:0}
.grid2>*{min-width:0;max-width:100%}
svg.ch{width:100%;max-width:100%;height:auto;display:block}
.echart{width:100%;max-width:100%;min-width:0;height:220px;position:relative}
.echart-spark{height:28px}
.echart-heat{height:240px}
.echart-hbar{height:auto;min-height:120px}
.zoom-reset{display:none;position:absolute;top:6px;right:6px;z-index:4;width:28px;height:28px;padding:0;border-radius:8px;background:var(--card2);color:var(--txt);border:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1}
.echart.is-zoomed .zoom-reset{display:inline-flex;align-items:center;justify-content:center}
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:10px;cursor:help;font-weight:700}
svg .grid{stroke:var(--line);stroke-width:1}svg .ax{fill:var(--mut)}
svg.ch .out-lab{font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;min-width:0;max-width:100%}
.bar-custom{background:transparent;border:none;padding:0;margin:0}
summary{cursor:pointer;font-weight:600}
.txt{max-width:min(420px,55vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best{background:rgba(59,130,246,.12)}
select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;max-width:100%}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto;background:var(--card2);padding:10px;border-radius:8px}
.log .w{color:var(--warn)}
tr.lowdata{opacity:.55;color:var(--mut)}
.disc{color:var(--mut);font-size:12.5px;margin:8px 0 12px}
.hmwrap{overflow:auto;margin:4px 0 0;max-width:100%;min-width:0}
.toplist{margin:4px 0 12px;padding-left:18px}
.toplist li{margin:2px 0}
h3{font-size:13px;margin:0 0 8px;color:var(--txt);text-transform:none;letter-spacing:0;font-weight:650}

<script>
(function(){

function isoWeek(s){const d=new Date(s+'T00:00:00Z');const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const y=d.getUTCFullYear();const j4=new Date(Date.UTC(y,0,4));const w=1+Math.round(((d-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7);return y+'-W'+String(w).padStart(2,'0');}

function med(arr){const a=arr.filter(v=>v!=null&&isFinite(v)).slice().sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}

function erOf(a){let e=0,i=0;for(const p of a){if(p.impressions>0&&p.eng_used!=null){e+=p.eng_used;i+=p.impressions;}}return i>0?e/i:null;}
function erCell(v,r){if(v==null)return '—';const x=r.er_source==='x';return fP(v)+` <span class="pill ${x?'p-ok':'p-mut'}" style="font-size:10px;padding:0 5px" title="${x?'X engagements / impressions':'Calculated: (likes+replies+reposts+quotes+bookmarks+profile visits+link clicks) / impressions'}">${x?'X':'c'}</span>`;}
const TYPE_NL={post:'post',reply:'reply',repost:'repost',quote:'quote'};
const TYPE_PL={post:'posts',reply:'replies',repost:'reposts',quote:'quotes'};
const MEDIA_NL={text:'text',image:'image',video:'video',thread:'thread'};
const MK_NL={text:'text only',image:'image',multi_image:'multiple images',video:'video',gif:'GIF',poll:'poll',link:'link',article:'article',thread:'thread',unknown:'unknown'};
const KIND_NL={post:'post',reply:'reply',quote:'quote',repost:'repost',thread:'thread'};
const LEN_NL={short:'short (< 80)',medium:'medium (80–200)',long:'long (201–280)',long_form:'long-form (> 280)'};
const DP_NL={night:'night (00–05)',morning:'morning (06–11)',afternoon:'afternoon (12–17)',evening:'evening (18–23)'};
const SPEED_NL={'15m':'within 15 min','1h':'within 1 hour','4h':'within 4 hours',later:'later'};
const HASH_NL={'0':'no hashtag','1-2':'1–2 hashtags','3+':'3+ hashtags'};
const LINE_NL={single:'one block',multi:'multiple lines'};
const IC=META.insights||{};
const MINN=IC.min_n||5;
const JUDGE_K=(IC.judge_k!=null&&IC.judge_k>0)?+IC.judge_k:3;
const HINT_MIN_W=0.5;
const ROI=META.roi||{};
const LOW_ROI_N=ROI.low_min_replies||5;
const LOW_ROI_IMP=ROI.low_max_mean_impressions||30;
const ROI_TOP_N=ROI.top_min_replies||3;
const mediaNL=m=>m?MEDIA_NL[m]||m:'unknown';
const pill=(t,c)=>`<span class="pill ${c||'p-mut'}">${esc(t)}</span>`;
const yn=(v,why,basis)=>v===true?pill('yes','p-ok'):v===false?pill('no','p-bad'):why==='lijst_onvolledig'?`<span class="pill p-warn" title="Not in the (incomplete) following list of ${basis?fD(basis):'?'} — may be missing data">unknown (list incomplete)</span>`:`<span class="pill p-mut" title="No following list available">unknown</span>`;
function followCaveat(){if(!F.latest_following_date||F.latest_following_complete)return '';const l=F.latest_following_loaded,t=F.latest_following_profile;return `<div class="warnbox">Following list incomplete: ${fN(l)} of ${t!=null?fN(t):'?'} loaded (snapshot ${fD(F.latest_following_date)}). If an account is not in the list, "still following?" is <b>unknown (list incomplete)</b> — not "no".</div>`;}

const state={preset:'30',start:null,end:null,streakReplies:false,engType:'nonrepost',roiQ:'',compare:true,hlDay:null,topQ:'',topPage:0,cardTab:'top',cardLimit:6,cardOpen:{}};
const SCORE={viewsW:0.4,engW:0.6,w:{likes:1,bookmarks:2,reposts:3,quotes:3,replies:4},lookbackDays:90,dayPostW:0.4,dayReplyW:0.6,streakMin:0.8,lights:{green:75,yellow:50,orange:25},deltaGreen:0.10,deltaYellow:-0.10,deltaOrange:-0.25,postsGoalDefault:2,repliesGoalDefault:10};
function scoreGoals(){const g=(typeof META!=='undefined'&&META.goal)||{};const p=g.posts_per_day,r=g.replies_per_day;return {posts:(p!=null&&p>0)?+p:SCORE.postsGoalDefault,replies:(r!=null&&r>0)?+r:SCORE.repliesGoalDefault};}
function messageKind(p){return (p&&p.type==='reply')?'reply':'post';}
function weightedEng(p,w){w=w||SCORE.w;if(!p)return 0;return (p.likes||0)*w.likes+(p.bookmarks||0)*w.bookmarks+(p.reposts||0)*w.reposts+(p.quotes||0)*w.quotes+(p.replies||0)*w.replies;}
function percentileRank(val,values){const a=(values||[]).filter(v=>v!=null&&isFinite(v));if(!a.length||val==null||!isFinite(val))return 0;let lt=0,eq=0;for(const v of a){if(v<val)lt++;else if(v===val)eq++;}return (lt+0.5*eq)/a.length;}
function valueScore(p,peers){if(!p)return 0;const kind=messageKind(p);const pool=(peers||[]).filter(x=>messageKind(x)===kind);const set=pool.some(x=>x===p||(p.id!=null&&x&&x.id===p.id))?pool:pool.concat([p]);const vr=percentileRank(p.impressions||0,set.map(x=>x.impressions||0));const er=percentileRank(weightedEng(p),set.map(x=>weightedEng(x)));return (SCORE.viewsW*vr+SCORE.engW*er)*100;}
function valueLookbackStart(today){return addDays(today||TODAY,-(SCORE.lookbackDays-1));}
function scoredPosts(){const lo=valueLookbackStart(TODAY);const byKind={post:[],reply:[]};for(const p of POSTS){if(!p||p.type==='repost')continue;if(p.local_date&&p.local_date>=lo)byKind[messageKind(p)].push(p);}const out=new Map();for(const p of POSTS){if(!p||p.type==='repost')continue;const kind=messageKind(p);const peers=byKind[kind]||[];out.set(p.id,valueScore(p,peers));}return out;}
function dayActivity(d,posts){const a=(posts||POSTS).filter(p=>p.local_date===d);return {posts:a.filter(p=>p.type==='post'||p.type==='quote').length,replies:a.filter(p=>p.type==='reply').length};}
function dayScore(d,posts,goals){goals=goals||scoreGoals();const a=dayActivity(d,posts);return SCORE.dayPostW*Math.min(1,a.posts/Math.max(1,goals.posts))+SCORE.dayReplyW*Math.min(1,a.replies/Math.max(1,goals.replies));}
function consistencyScore(days,posts,goals){const ds=(days||[]).map(d=>dayScore(d,posts,goals));if(!ds.length)return null;return ds.reduce((t,v)=>t+v,0)/ds.length*100;}
function currentStreak(days,posts,goals){const a=(days||[]).slice();let n=0;for(let i=a.length-1;i>=0;i--){if(dayScore(a[i],posts,goals)+1e-12>=SCORE.streakMin)n++;else break;}return n;}
function trafficLightScore(v){if(!(v>=0)&&!(v<0))return 'red';if(v>=SCORE.lights.green)return 'green';if(v>=SCORE.lights.yellow)return 'yellow';if(v>=SCORE.lights.orange)return 'orange';return 'red';}
function trafficLightDelta(pct){if(pct==null||!isFinite(pct))return '';if(pct>=SCORE.deltaGreen)return 'green';if(pct>=SCORE.deltaYellow)return 'yellow';if(pct>=SCORE.deltaOrange)return 'orange';return 'red';}
function tlHex(tone){const light=(typeof document!=='undefined'&&document.documentElement&&document.documentElement.getAttribute('data-theme')==='light');const m=light?{green:'#15803d',yellow:'#a16207',orange:'#c2410c',red:'#b91c1c'}:{green:'#22c55e',yellow:'#eab308',orange:'#fb923c',red:'#f43f5e'};return m[tone]||m.yellow;}
function postPermalink(p){if(p&&p.url)return p.url;const id=p&&p.id;if(!id)return 'https://x.com/home';return ACC?`https://x.com/${ACC}/status/${id}`:`https://x.com/i/web/status/${id}`;}
function replyLine(p){if(!p||p.type!=='reply')return '';if(IS_PUBLIC||!p.in_reply_to_handle)return 'Replying to a post';return 'Replying to @'+p.in_reply_to_handle;}
function valueFormulaTip(){return 'Value score (0–100): '+Math.round(SCORE.viewsW*100)+'% × percentile rank of views + '+Math.round(SCORE.engW*100)+'% × percentile rank of weighted engagements, vs the same type (posts vs replies) in the last '+SCORE.lookbackDays+' days. Weighted engagements = likes×'+SCORE.w.likes+' + bookmarks×'+SCORE.w.bookmarks+' + reposts×'+SCORE.w.reposts+' + quotes×'+SCORE.w.quotes+' + replies received×'+SCORE.w.replies+'.';}
function consistencyFormulaTip(){const g=scoreGoals();return 'Day score = '+SCORE.dayPostW+' × min(1, posts/'+g.posts+') + '+SCORE.dayReplyW+' × min(1, replies/'+g.replies+'). Consistency is the average day score in this period × 100. Streak = consecutive complete days with day score ≥ '+SCORE.streakMin+', counted through the last complete day and not clipped by the selected period. Incomplete days (after the last data date, and today) are excluded from activity scores, sparklines, and deltas. Follower counts use the latest snapshot (point-in-time), including today.';}
function lastDataDate(){let m='';const snaps=(typeof F!=='undefined'&&F&&F.snapshots)||[];for(const s of snaps){if(s&&s.date&&(!m||s.date>m))m=s.date;}const posts=(typeof POSTS!=='undefined'&&POSTS)||[];for(const p of posts){if(p&&p.local_date&&(!m||p.local_date>m))m=p.local_date;}return m||'';}
function lastCompleteDay(){const last=lastDataDate();const yest=addDays(TODAY,-1);if(!last)return yest;return last<yest?last:yest;}
function isIncompleteDay(d){return !d||d>lastCompleteDay();}

function kpiCompleteRange(start,end){

function streakDays(){

/* ---------- 6. Top posts & patterns ---------- */

function postsExplorer(rows){
  const q=(state.topQ||'').trim().toLowerCase();
  let r=rows.map(p=>({created_at:p.created_at,local_date:p.local_date,local_time:p.local_time,text:p.text||'',impressions:p.impressions,eng_used:p.eng_used,er:p.er,replies:p.replies,url:p.url,id:p.id,er_source:p.er_source,type:p.type,media:p.media}));
  if(q) r=r.filter(p=> (p.local_date||'').includes(q) || (p.text||'').toLowerCase().includes(q) || String(p.impressions??'').includes(q) || String(p.eng_used??'').includes(q) || String(p.replies??'').includes(q) || (p.er!=null&&fP(p.er).toLowerCase().includes(q)));
  const st=SORT.ptop||{key:'impressions',desc:true};
  r.sort((a,b)=>{const va=a[st.key],vb=b[st.key];if(va==null&&vb!=null)return 1;if(vb==null&&va!=null)return -1;return cmp(va,vb)*(st.desc?-1:1);});
  const pageSize=10;const pages=Math.max(1,Math.ceil(r.length/pageSize));
  if(state.topPage>=pages) state.topPage=pages-1;
  if(state.topPage<0) state.topPage=0;
  const slice=r.slice(state.topPage*pageSize,(state.topPage+1)*pageSize);
  const cols=[
    {key:'local_date',label:'Date',fmt:(v,row)=>fDs(v)+'<span class="c-time"> '+(row.local_time||'')+'</span>'},
    {key:'text',label:'Text',cls:'txt',fmt:(v,row)=>postLink(row)},
    {key:'impressions',label:'Impressions',num:1,fmt:fN},
    {key:'eng_used',label:'Engagements',num:1,cls:'c-extra',fmt:fN},
    {key:'er',label:'Rate',num:1,cls:'c-extra',fmt:erCell},
    {key:'replies',label:'Replies',num:1,cls:'c-extra',fmt:fN}
  ];
  SORT.ptop=st;
  const tbl=table('ptop',cols,slice,st,{empty:emptyMsg('Not enough data yet'),wrapId:'top-wrap',wrapClass:'top-full'});
  return `<h3>Top posts</h3><div class="table-tools"><input type="search" id="top-q" value="${esc(state.topQ||'')}" placeholder="Search date, text, impressions…" autocomplete="off"></div>${tbl}<div class="pager"><button type="button" id="top-prev" ${state.topPage<=0?'disabled':''}>Prev</button><span>${state.topPage+1} / ${pages}</span><button type="button" id="top-next" ${state.topPage>=pages-1?'disabled':''}>Next</button></div>`;
}
function topList(a,key,n){return a.filter(p=>p[key]!=null&&(key!=='er'||p.impressions>0)).sort((x,y)=>y[key]-x[key]).slice(0,n);}
function topKind(p){const raw=p.media;if(!raw||raw==='unknown')return '';const ml=mediaNL(raw);if(!ml||ml==='unknown')return '';const tp=TYPE_NL[p.type]||p.type||'';return tp?`${esc(tp)} · ${esc(ml)}`:esc(ml);}
function miniTop(a,key){const t=topList(a,key,5);if(!t.length)return EMPTY;return '<div class="tw mini-top"><table><colgroup><col class="rank"><col><col class="metrics"></colgroup><tbody>'+t.map((p,i)=>{const primary=key==='er'?fP(p.er):fN(p.impressions)+' impr.';const secondary=key==='er'?fN(p.impressions)+' impr.':fP(p.er);const kind=topKind(p);const when=`${fDs(p.local_date)} ${p.local_time||''}`.trim();const meta=[when,kind].filter(Boolean).join(' · ');return `<tr><td class="num">${i+1}</td><td class="txt">${postLink(p)}<div class="top-meta">${meta}<span class="top-metrics"> · ${primary}</span></div></td><td class="met mini-top-metric">${primary}</td></tr>`;}).join('')+'</tbody></table></div>';}
function groupTable(tid,groups,labelFn){const rows=groups.map(([k,a])=>{const imps=a.filter(p=>p.impressions!=null).map(p=>p.impressions);return{k,label:labelFn(k),n:a.length,avg:imps.length?imps.reduce((t,v)=>t+v,0)/imps.length:null,med:med(imps),er:erOf(a),nf:has(a,'new_follows')?sum(a,'new_follows')/a.filter(p=>p.new_follows!=null).length:null};});
  let best=null;rows.forEach(r=>{if(r.med!=null&&(!best||r.med>best.med||(r.med===best.med&&(r.avg||0)>(best.avg||0))))best=r;});if(best)best._cls='best';
  return {html:table(tid,[{key:'label',label:'',fmt:v=>esc(v)},{key:'n',label:'n',num:1,fmt:fN},{key:'avg',label:'Avg. impressions',num:1,fmt:f1},{key:'med',label:'Median impressions',num:1,fmt:f1},{key:'er',label:'ER (weighted)',num:1,fmt:fP},{key:'nf',label:'Avg. new followers',num:1,fmt:f1}],rows,null),best};}
function sec6(){let h=`<h2>${STR.patterns}</h2>`;

function slotLbl(wd,hr){return WD[wd]+' '+String(hr).padStart(2,'0')+':00–'+String(hr).padStart(2,'0')+':59';}

function grpRows(items,keyFn){const g={};for(const p of items){const k=keyFn(p);if(k==null||k==='')continue;(g[k]=g[k]||[]).push(p);}return Object.keys(g).sort().map(k=>{const a=g[k],n=a.length;return{k,n,low:n<MINN,_cls:n<MINN?'lowdata':'',medImp:med(a.map(p=>p.impressions)),medEr:med(a.map(p=>p.er)),medLikes:med(a.map(p=>p.likes)),medReplies:med(a.map(p=>p.replies)),medReposts:med(a.map(p=>p.reposts)),medBm:med(a.map(p=>p.bookmarks)),vis1k:med(a.map(p=>p.visits_per_1k)),fol1k:med(a.map(p=>p.follows_per_1k))};});}

function miniBars(rows,valKey,pool){const vis=rows.filter(r=>r[valKey]!=null);if(!vis.length)return '';const mx=Math.max(1,...vis.map(r=>r[valKey]));const n=vis.length;

function metricBarShort(r,valKey){if(!r)return '';if(valKey==='medEr')return r.medEr==null?'—':fP(r.medEr);return compactN(r[valKey]);}
function metricBarLabel(r,valKey){if(!r)return '';if(valKey==='medEr')return 'median '+(r.medEr==null?'—':fP(r.medEr))+' ER';const v=r[valKey];return 'median '+(v==null?'—':fN(Math.round(v)))+' impressions';}
function heatSvg(posts,valFn,kind){const cells={};for(const p of posts){if(p.hour==null||p.weekday==null)continue;const k=p.weekday+'-'+p.hour;(cells[k]=cells[k]||[]).push(p);}
  const stats={};const cellVals=[];for(let d=0;d<7;d++)for(let h=0;h<24;h++){const a=cells[d+'-'+h]||[];const n=a.length,val=n?valFn(a):null;if(val!=null)cellVals.push(val);stats[d+'-'+h]={n,val,er:med(a.map(p=>p.er)),imp:med(a.map(p=>p.impressions)),impMean:mean(a.map(p=>p.impressions)),vis:med(a.map(p=>p.profile_visits)),fol:med(a.map(p=>p.new_follows))};}
  const rng=heatRange(cellVals);

    animationDuration:240,

const HEAT_MIN_COV=0.25;
function heatCoverage(stats,minN){minN=minN==null?MINN:minN;let ok=0,n=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++){n++;if(((stats[d+'-'+h]||{}).n||0)>=minN)ok++;}return n?ok/n:0;}
function heatPanel(title,posts,valFn){if(!posts||!posts.length)return fold(title,EMPTY);if(posts.every(p=>p.hour==null))return fold(title,'<div class="empty">No timestamps</div>');const heat=heatSvg(posts,valFn,/reply/i.test(title)?'reply':'post');return fold(title,heat.html);}
function heatCard(title,posts,valFn,kind){
  if(!posts||!posts.length)return `<h3>${esc(title)}</h3>`+EMPTY;
  if(posts.every(p=>p.hour==null))return `<h3>${esc(title)}</h3>`+emptyMsg('No timestamps');

}
function topSlots(stats,n=3){const rows=[];for(let d=0;d<7;d++)for(let h=0;h<24;h++){const s=stats[d+'-'+h];if(!s||s.n<MINN||s.val==null)continue;rows.push({d,h,label:slotLbl(d,h),...s});}
  rows.sort((a,b)=>(b.shrink!=null&&a.shrink!=null?b.shrink-a.shrink:b.val-a.val)||b.n-a.n);return rows.slice(0,n);}
function hintSlots(stats,n=3){const rows=[];for(let d=0;d<7;d++)for(let h=0;h<24;h++){const s=stats[d+'-'+h];if(!s||!(s.n>0)||s.low==null||!judgeHintable(s.n))continue;rows.push({d,h,label:slotLbl(d,h),...s});}
  rows.sort((a,b)=>(b.low-a.low)||b.n-a.n);return rows.slice(0,n);}
function slotAdviceHtml(stats,kind){
  const verb=kind==='reply'?'reply':'post';
  const proven=topSlots(stats,3);
  if(proven.length)return `<div class="judge-advice">Best time to ${verb}: ${esc(proven.map(t=>t.label+' (n='+t.n+')').join(', '))}.</div>`;
  const hints=hintSlots(stats,1);
  if(hints.length){const u=pluralize(hints[0].n,verb);return `<div class="judge-advice">Strongest so far: ${esc(hints[0].label)} (${fN(hints[0].n)} ${u}). No hour is proven yet.</div>`;}

}
function missingNotes(P){const notes=[];if(!P.length)return notes;

  const noMedia=P.filter(p=>p.media_source==='missing').length;
  if(noMedia===P.length)notes.push('No media field in the source. The X content export has no media column. Optionally set <code>media</code> in data/posts (text / image / multi_image / video / gif / poll / link / article). Only an external URL in the text is inferred as “link”; otherwise it stays unknown.');
  else if(noMedia)notes.push(`${fN(noMedia)} post(s) without a media field (count as unknown, unless the text contains an external URL).`);

  if(inf)notes.push(`${fN(inf)} post(s) without an explicit <code>type</code> (inferred from the text). For a reliable type comparison: field <code>type</code> in JSON or a Type column in the CSV.`);

  if(replies.length&&!withParent.length)notes.push('Reply speed is not available in the current data. Optionally add <code>in_reply_to_created_at</code> (timestamp of the post being replied to) — see README. A parent time is never guessed.');
  return notes;}
function autoSummary(own,replies,mediaRows){const bits=[];

function secBest(){

function consistencyCalendar(days){
  days=days||calendarDays();
  if(!days.length)return '';
  const pad=wdOf(days[0]);
  const cells=[];
  for(let i=0;i<pad;i++)cells.push(null);
  days.forEach(d=>cells.push(d));
  while(cells.length%7)cells.push(null);
  const labels=WD.map(w=>`<span>${w}</span>`).join('');
  const weeks=cells.length/7;
  const months=[];
  let lastLab=-99;
  for(let w=0;w<weeks;w++){
    let first=null,prev=null;
    for(let r=0;r<7;r++){if(!first&&cells[w*7+r])first=cells[w*7+r];if(w>0&&!prev&&cells[(w-1)*7+r])prev=cells[(w-1)*7+r];}
    const changed=!!(first&&(!prev||first.slice(0,7)!==prev.slice(0,7)));
    if(changed){
      if(lastLab>=0&&w-lastLab<2) months[lastLab]='<span class="cal-mon"></span>';
      lastLab=w;
      months.push(`<span class="cal-mon">${MONS[+first.slice(5,7)-1]}</span>`);
    }else months.push('<span class="cal-mon"></span>');
  }
  const boxes=cells.map(d=>{
    if(!d)return '<span class="cal-cell"></span>';
    const inRange=inR(d);
    const rangeCls=inRange?' is-in-range':' is-out';
    if(d>TODAY||isIncompleteDay(d))return `<span class="cal-cell is-incomplete${rangeCls}" data-date="${esc(d)}" title="${esc(fDs(d)+' · incomplete')}"></span>`;
    const first=minDataDate();
    if(first&&d<first)return `<span class="cal-cell${rangeCls}" data-date="${esc(d)}" title="${esc(fDs(d))}"></span>`;
    const sc=dayScore(d)*100;
    const tone=trafficLightScore(sc);
    return `<span class="cal-cell tl-${tone}${rangeCls}" data-date="${esc(d)}" title="${esc(fDs(d)+' · '+sc.toLocaleString('en-US',{maximumFractionDigits:0}))}"></span>`;
  }).join('');
  return `<div class="cal-wrap" id="consistency-cal" style="--cal-n:${weeks}"><div class="cal-head"><h3>Consistency calendar</h3></div><div class="cal-grid-wrap"><div class="cal-months" aria-hidden="true">${months.join('')}</div><div class="cal-wd" aria-hidden="true">${labels}</div><div class="cal-grid" role="img" aria-label="Consistency calendar">${boxes}</div></div></div>`;
}

    return `<button type="button" data-card-tab="${k}" class="${tab===k?'on':''}" aria-pressed="${tab===k?'true':'false'}">${lab}</button>`;
  }).join('');
  const tabBar=`<h3>Posts ${tipIcon(valueFormulaTip())}</h3><div class="post-tools"><div class="ptabs" role="tablist">${tabs}</div></div>`;
  if(tab==='top'){
    const posts=all.filter(p=>p.type==='post'||p.type==='quote').slice().sort(byScore);
    const replies=all.filter(p=>p.type==='reply').slice().sort(byScore);
    const half=Math.max(1,Math.ceil((state.cardLimit||6)/2));
    const more=(posts.length>half||replies.length>half)?`<button type="button" class="card-more" id="card-more">Load more</button>`:'';
    const left=posts.slice(0,half).map(p=>postCard(p,scores.get(p.id)||0)).join('')||EMPTY;
    const right=replies.slice(0,half).map(p=>postCard(p,scores.get(p.id)||0)).join('')||EMPTY;
    const n=Math.max(posts.slice(0,half).length,replies.slice(0,half).length,1);
    return `${tabBar}<div class="post-split" id="post-split" style="--split-n:${n}"><div class="post-col" data-split="posts"><h4 class="split-h">Top posts</h4><div class="post-grid">${left}</div></div><div class="post-col" data-split="replies"><h4 class="split-h">Top replies</h4><div class="post-grid">${right}</div></div></div>${more}`;
  }
  let rows=all;
  if(tab==='posts') rows=rows.filter(p=>p.type==='post'||p.type==='quote');
  if(tab==='replies') rows=rows.filter(p=>p.type==='reply');
  if(tab==='latest') rows=rows.slice().sort((a,b)=>String(b.created_at||b.local_date||'').localeCompare(String(a.created_at||a.local_date||'')));
  else rows=rows.slice().sort(byScore);
  if(!rows.length)return tabBar+EMPTY;
  const limit=state.cardLimit||6;
  const slice=rows.slice(0,limit);
  const more=rows.length>limit?`<button type="button" class="card-more" id="card-more">Load more</button>`:'';
  return `${tabBar}<div class="post-grid" id="post-grid">${slice.map(p=>postCard(p,scores.get(p.id)||0)).join('')}</div>${more}`;
}

function syncPeriodButtons(){
  const det=document.querySelector('#filterbar details.bar-custom');
  const customOn=state.preset==='custom'||(det&&det.open);
  document.querySelectorAll('#filterbar button[data-p]').forEach(b=>{const on=!customOn&&b.dataset.p===state.preset;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
  if(det) det.classList.toggle('on',state.preset==='custom');
}
function render(){
  syncPeriodButtons();

  const tn=document.getElementById('top-next');if(tn)tn.onclick=()=>{state.topPage=(state.topPage||0)+1;render();};
  document.querySelectorAll('[data-card-tab]').forEach(b=>{b.onclick=()=>{state.cardTab=b.getAttribute('data-card-tab');state.cardLimit=6;render();};});
  const cm=document.getElementById('card-more');if(cm)cm.onclick=()=>{state.cardLimit=(state.cardLimit||6)+6;render();};
  document.querySelectorAll('.pcard-more').forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();const id=b.getAttribute('data-id');state.cardOpen=state.cardOpen||{};state.cardOpen[id]=!state.cardOpen[id];const card=b.closest('.pcard');if(card)card.classList.toggle('is-open',state.cardOpen[id]);b.textContent=state.cardOpen[id]?'Show less':'Show more';};});
  if(IS_DEMO){document.querySelectorAll('a.pcard-hit[href="#"]').forEach(a=>{a.addEventListener('click',e=>e.preventDefault());});}
  const cmp=document.getElementById('cmp-prev');if(cmp){syncCompareUi();cmp.onchange=()=>{if(cmp.disabled)return;state.compare=cmp.checked;closeMore();render();};}
  const th=document.getElementById('theme-toggle');if(th){th.textContent=document.documentElement.getAttribute('data-theme')==='light'?'Dark':'Light';th.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('xdash-theme',next);}catch(e){}closeMore();render();};}
  const more=document.getElementById('more-btn');const tools=document.getElementById('bar-tools');
  if(more&&tools){more.onclick=e=>{e.stopPropagation();const open=tools.classList.toggle('open');more.setAttribute('aria-expanded',open?'true':'false');};}
  bindAvatarFallbacks();
  mountCharts();
  fitAxisFonts();
}
function closeMore(){const more=document.getElementById('more-btn');const tools=document.getElementById('bar-tools');if(tools)tools.classList.remove('open');if(more)more.setAttribute('aria-expanded','false');}
function syncCompareUi(){const cmp=document.getElementById('cmp-prev');if(!cmp)return;const ok=prevFullyCovered();cmp.disabled=!ok;const tip=ok?'':'Not enough history';cmp.title=tip;const lab=cmp.closest('label');if(lab)lab.title=tip;cmp.checked=!!(state.compare&&ok);const hint=document.getElementById('cmp-hint');if(hint){hint.textContent='Not enough history';hint.classList.toggle('is-on',!ok);if(!ok)hint.removeAttribute('hidden');else hint.setAttribute('hidden','');}}
function setPreset(p){closeMore();const det=document.querySelector('#filterbar details.bar-custom');if(det)det.open=false;state.preset=p;state.end=TODAY;state.start=p==='all'?minDataDate():addDays(TODAY,-(+p-1));render();}
document.querySelectorAll('#filterbar button[data-p]').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));
document.getElementById('fapply').onclick=()=>{closeMore();const a=document.getElementById('fs').value,b=document.getElementById('fe').value;if(!a||!b||a>b){alert('Choose a valid start and end date (start ≤ end).');return;}state.preset='custom';state.start=a;state.end=b;render();};
document.addEventListener('pointerdown',e=>{const more=document.getElementById('more-btn');const tools=document.getElementById('bar-tools');if(!tools||!tools.classList.contains('open'))return;if(tools.contains(e.target)||(more&&more.contains(e.target)))return;closeMore();});
document.addEventListener('toggle',e=>{const t=e.target;if(!t||t.tagName!=='DETAILS')return;if(t.classList.contains('bar-custom'))syncPeriodButtons();if(t.open)setTimeout(()=>fitAxisFonts(t),0);},true);
